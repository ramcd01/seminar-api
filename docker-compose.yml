services:
  # 데이터베이스 서비스
  db:
    image: mariadb:10.6
    container_name: seminar_db
    restart: always
    environment:
      MYSQL_DATABASE: seminar_db
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # 컨테이너 시작 시 초기화 스크립트 실행
      - ./migrations:/docker-entrypoint-initdb.d

  # API 웹 서비스
  web:
    build: .
    container_name: seminar_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: 1234
      DB_NAME: seminar_db
    depends_on:
      - db

# 데이터를 영구 보존하기 위한 볼륨 설정
volumes:
  db_data:
