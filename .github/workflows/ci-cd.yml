name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted # 내 서버 러너에서 실행
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          # 서버의 프로젝트 폴더로 이동
          cd /home/user/0602/seminar-api
          
          # 1. 코드 업데이트
          git pull origin main
          
          # 2. 도커 컨테이너 재빌드 및 재시작
          docker-compose down
          docker-compose up -d --build
